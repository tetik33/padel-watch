name: Eversports Auto Check
on:
  workflow_dispatch: # This lets you click a button in GitHub to run it
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours to test

jobs:
  check-courts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests playwright
      - name: Install Playwright browsers
        run: playwright install chromium
        
      - name: Run Eversports Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVERTSPORTS_EMAIL: ${{ secrets.EVERS_EMAIL }}
          EVERTSPORTS_PASSWORD: ${{ secrets.EVERS_PASSWORD }}
        run: python eversports_auto.py
